syntax = "proto3";

package gemell.geometry.v1;

import "gemell/geometry/v1/curves.proto";

// Generic attribute data container
//
// Supports arbitrary custom attributes on geometry (e.g., "uv", "color", "weight").
// Attributes are stored as typed arrays with an associated domain (point, curve, face, etc.).
message AttributeData {
  // Attribute value type (exactly one must be set)
  oneof data_type {
    FloatArray float_values = 1;
    IntArray int_values = 2;
    Vec3Array vec3_values = 3;
    StringArray string_values = 4;
    BoolArray bool_values = 5;
    Vec2Array vec2_values = 6;       // Reserved for UV coordinates
    ColorArray color_values = 7;     // Reserved for RGBA colors
  }

  // Attribute domain (where the attribute lives)
  // Examples: "point", "curve", "face", "edge", "corner"
  // Default: "" (unspecified, infer from array length)
  string domain = 10;

  // Attribute data type hint (for semantic interpretation)
  // Examples: "float", "int", "vec3", "color", "uv"
  // Default: "" (infer from oneof data_type)
  string data_type_hint = 11;

  // Reserved for future expansion
  reserved 100 to 199;
}

// Array of float values
message FloatArray {
  repeated float values = 1;
}

// Array of integer values
message IntArray {
  repeated int32 values = 1;
}

// Array of 3D vectors
message Vec3Array {
  repeated Vec3f values = 1;
}

// Array of 2D vectors (e.g., UV coordinates)
message Vec2Array {
  repeated Vec2f values = 1;
}

// 2D vector
message Vec2f {
  float x = 1;
  float y = 2;
}

// Array of RGBA colors
message ColorArray {
  repeated ColorRGBA values = 1;
}

// RGBA color (values typically in [0,1])
message ColorRGBA {
  float r = 1;
  float g = 2;
  float b = 3;
  float a = 4;  // Alpha channel (1.0 = opaque)
}

// Array of string values
message StringArray {
  repeated string values = 1;
}

// Array of boolean values
message BoolArray {
  repeated bool values = 1;
}
