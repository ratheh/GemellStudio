syntax = "proto3";

package gemell.geometry.v1;

import "gemell/geometry/v1/curves.proto";
import "gemell/geometry/v1/attributes.proto";
import "gemell/geometry/v1/materials.proto";

// Top-level geometry data container for Blender ↔ External Service IPC
//
// This is the root message type used in shared memory communication between
// Blender (GemellStudio) and external geometry node services (e.g., Warp).
//
// Architecture:
//   1. Blender serializes GeometryData to protobuf bytes
//   2. Blender writes bytes to shared memory region
//   3. Blender sends shared memory ID to external service via REST API
//   4. External service maps shared memory, parses GeometryData
//   5. External service processes geometry, creates output GeometryData
//   6. External service writes output to new shared memory region
//   7. External service returns output shared memory ID to Blender
//   8. Blender maps output shared memory, parses GeometryData
//
// Extensibility:
//   - Use `oneof geometry_type` to support future geometry types (mesh, points, etc.)
//   - Use `attributes` map for arbitrary custom data
//   - Version field for protocol compatibility checks
message GeometryData {
  // ------------------------------------------------------------------
  // Geometry type (exactly one must be set)
  // ------------------------------------------------------------------

  oneof geometry_type {
    CurveGeometry curves = 1;        // Curve/spline geometry
    // Future geometry types:
    // MeshGeometry mesh = 2;         // Triangle mesh geometry
    // PointCloudGeometry points = 3; // Point cloud geometry
    // VolumeGeometry volume = 4;     // Volumetric data
    // InstanceGeometry instances = 5; // Instanced geometry
  }

  // ------------------------------------------------------------------
  // Generic attributes (custom user data)
  // ------------------------------------------------------------------

  // Arbitrary named attributes attached to the geometry
  // Key: Attribute name (e.g., "uv", "color", "weight", "custom_data")
  // Value: Attribute data (float/int/vec3/string arrays)
  map<string, AttributeData> attributes = 10;

  // ------------------------------------------------------------------
  // Material data (optional)
  // ------------------------------------------------------------------

  // Material profiles associated with this geometry
  // For curves: typically one per curve (referenced by CurveGeometry.material_indices)
  // For mesh: typically one per face or material slot
  MaterialProfileArray material_profiles = 15;

  // ------------------------------------------------------------------
  // Metadata
  // ------------------------------------------------------------------

  // Protocol version for compatibility checks
  // Current version: 1
  // Increment on breaking changes to geometry_type or attributes structure
  uint32 version = 20;

  // Human-readable description (optional, for debugging)
  string description = 21;

  // Timestamp of geometry creation (Unix timestamp in seconds, optional)
  uint64 timestamp = 22;

  // Session ID that created this geometry (optional, for tracking)
  string session_id = 23;

  // ------------------------------------------------------------------
  // Reserved field numbers for future expansion
  // ------------------------------------------------------------------

  // Reserved for additional geometry types
  reserved 6 to 9;

  // Reserved for future metadata fields
  reserved 24 to 49;

  // Reserved for future top-level data
  reserved 50 to 99;

  // Reserved for extensions
  reserved 100 to 199;
}

// Optional: Batch of multiple geometry data objects
//
// Useful for operations that process multiple geometries at once
// (e.g., boolean operations, merging, batched execution)
message GeometryDataBatch {
  repeated GeometryData geometries = 1;

  // Batch metadata
  string batch_id = 10;
  string description = 11;
}
